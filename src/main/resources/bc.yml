template: Hello, %s!
defaultName: Stranger

server:
  #  softNofileLimit: 1000
  #  hardNofileLimit: 1000
  applicationConnectors:
    - type: https
      port: 8180
      # TLS keystore and its password are supplied at runtime; never commit them.
      keyStorePath: ${BC_KEYSTORE_PATH}
      keyStorePassword: ${BC_KEYSTORE_PASSWORD}
    #this requires the alpn-boot library on the JVM's boot classpath
    #- type: h2
    #  port: 8445
    #  keyStorePath: example.keystore
    #  keyStorePassword: example
  adminConnectors:
    - type: https
      port: 8181
      # admin endpoints (metrics, thread dumps, tasks) have no authentication: keep them local
      bindHost: 127.0.0.1
      keyStorePath: ${BC_KEYSTORE_PATH}
      keyStorePassword: ${BC_KEYSTORE_PASSWORD}